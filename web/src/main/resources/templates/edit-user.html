<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustlist - Editează Utilizator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 520px; width: 100%; padding: 40px; margin: 50px auto;
        }
        .btn-auth {
            background: linear-gradient(135deg, #0d3d4d 0%, #15798a 100%);
            color: white; border-radius: 12px; padding: 12px; font-weight: 700; border: none; width: 100%;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="mb-4 text-center">
        <h4 class="fw-bold">Editează Utilizatorul</h4>
        <p class="text-muted small" th:text="'Modifici datele pentru @' + ${user.username}"></p>
    </div>

    <!-- S-a corectat id-ul aici: ${user.userid} -->
    <form th:action="@{/users/edit/{id}(id=${user.userid})}" th:object="${user}" method="post">

        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="form-label fw-semibold">Nume</label>
                <input type="text" th:field="*{nume}" class="form-control" required>
            </div>
            <div class="col-6">
                <label class="form-label fw-semibold">Prenume</label>
                <input type="text" th:field="*{prenume}" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">URL Poză Profil</label>
            <input type="url" th:field="*{photourl}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Parolă nouă (opțional)</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Lasă gol dacă nu vrei să o schimbi">
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Tip Cont</label>
            <select th:field="*{userOrProvider}" class="form-select">
                <option th:value="false">Client (User)</option>
                <option th:value="true">Prestator (Provider)</option>
            </select>
        </div>

        <button type="submit" class="btn btn-auth mb-2">Salvează Modificările</button>
        <a th:href="@{/users/{id}(id=${user.userid})}" class="btn btn-light w-100 rounded-3 fw-semibold">Anulează</a>
    </form>
</div>

</body>
</html>
