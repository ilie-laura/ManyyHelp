<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${partner != null ? 'Chat cu ' + partner.nume : 'Chat'}">Chat Trustlist</title>

    <!-- Bootstrap 5, Icons & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
        }
        .chat-container-card {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .chat-box {
            height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f8fafc;
        }
        .msg-bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg-sent {
            align-self: flex-end;
            background-color: #0284c7;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .msg-received {
            align-self: flex-start;
            background-color: #ffffff;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }
        .time-text-sent {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.7rem;
        }
        .time-text-received {
            color: #94a3b8;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 760px;" th:if="${partner != null and loggedUser != null}">
    <div class="card border-0 chat-container-card overflow-hidden bg-white">

        <!-- Header Chat -->
        <div class="card-header bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/mainPage}" class="btn btn-sm btn-light border rounded-circle" title="Înapoi">
                    <i class="bi bi-arrow-left"></i>
                </a>

                <!-- Avatar partener -->
                <div class="rounded-circle bg-info-subtle text-info fw-bold d-flex align-items-center justify-content-center border border-2 border-info"
                     style="width: 42px; height: 42px; font-size: 1rem;">
                    <span th:text="${partner.username != null ? #strings.substring(partner.username, 0, 1).toUpperCase() : 'U'}">U</span>
                </div>

                <div>
                    <h6 class="fw-bold mb-0 text-dark" th:text="${partner.nume + ' ' + (partner.prenume != null ? partner.prenume : '')}">Ion Popescu</h6>
                    <small class="text-muted" th:text="${partner.userOrProvider ? 'Furnizor de servicii' : 'Client'}">Furnizor</small>
                </div>
            </div>

            <a th:href="@{/users/{id}(id=${partner.userid})}" class="btn btn-sm btn-light border rounded-pill px-3 text-secondary">
                <i class="bi bi-person me-1"></i> Profil
            </a>
        </div>

        <!-- Zona de Mesaje -->
        <div class="card-body chat-box p-3" id="chatContainer">
            <th:block th:if="${messages != null and !#lists.isEmpty(messages)}">
                <div th:each="msg : ${messages}"
                     th:if="${msg != null and msg.senderId != null}"
                     th:class="${msg.senderId.userid == loggedUser.userid} ? 'msg-bubble msg-sent' : 'msg-bubble msg-received'">

                    <div th:text="${msg.content}">Mesaj...</div>
                    <small class="d-block text-end mt-1"
                           th:classappend="${msg.senderId.userid == loggedUser.userid} ? 'time-text-sent' : 'time-text-received'"
                           th:if="${msg.sentAt != null}"
                           th:text="${#temporals.format(msg.sentAt, 'HH:mm')}">14:30</small>
                </div>
            </th:block>

            <div th:if="${messages == null or #lists.isEmpty(messages)}" class="text-center my-auto text-muted small py-5">
                <i class="bi bi-chat-dots fs-1 d-block mb-2 text-secondary opacity-50"></i>
                Nu există mesaje în această conversație.<br>Scrie primul mesaj mai jos!
            </div>
        </div>

        <!-- Formular Trimitere Mesaj -->
        <form th:action="@{/chat/send}" method="post" class="card-footer bg-white border-top p-3 m-0">
            <input type="hidden" name="receiverId" th:value="${partner.userid}" />
            <div class="input-group">
                <input type="text" name="content" class="form-control rounded-pill-start border shadow-none px-3" placeholder="Scrie un mesaj aici..." autocomplete="off" required>
                <button type="submit" class="btn btn-info text-white rounded-pill-end px-4 fw-bold shadow-none">
                    <i class="bi bi-send-fill me-1"></i> Trimite
                </button>
            </div>
        </form>

    </div>
</div>

<!-- Fallback dacă sesiunea sau utilizatorul nu sunt găsite -->
<div class="container py-5 text-center" th:if="${partner == null or loggedUser == null}">
    <div class="alert alert-warning rounded-4 shadow-sm">
        Utilizatorul nu a fost găsit sau sesiunea a expirat.
    </div>
    <a th:href="@{/mainPage}" class="btn btn-info text-white rounded-pill px-4">Înapoi la pagina principală</a>
</div>

<script>
    // Auto-scroll până la ultimul mesaj la încărcarea paginii
    const container = document.getElementById("chatContainer");
    if (container) {
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
