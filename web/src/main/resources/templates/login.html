<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustlist - Autentificare</title>

    <!-- Bootstrap 5 CSS & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 440px;
            width: 100%;
            padding: 40px;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.8rem;
            color: #0d3b4c;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            font-weight: 500;
        }

        .form-control:focus {
            border-color: #15798a;
            box-shadow: 0 0 0 4px rgba(21, 121, 138, 0.15);
        }

        .btn-auth {
            background: linear-gradient(135deg, #0d3d4d 0%, #15798a 100%);
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            border: none;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            opacity: 0.95;
            color: white;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="text-center mb-4">
        <a href="/" class="brand-logo mb-2">
            <i class="bi bi-stars text-info"></i> Trustlist
        </a>
        <h4 class="fw-bold mt-2">Bine ai revenit!</h4>
        <p class="text-muted small">Autentifică-te pentru a accesa contul tău</p>
    </div>

    <!-- Mesaje de Alertă -->
    <div th:if="${param.error}" class="alert alert-danger py-2 small rounded-3 mb-3">
        Nume de utilizator sau parolă incorectă.
    </div>
    <div th:if="${param.success}" class="alert alert-success py-2 small rounded-3 mb-3">
        Contul a fost creat! Te poți autentifica.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold">Utilizator</label>
            <input type="text" name="username" class="form-control" placeholder="Numele tău de utilizator" required>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Parolă</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-auth mb-3">Login</button>

        <p class="text-center small text-muted mb-0">
            Nu ai un cont încă? <a th:href="@{/register}" class="text-info fw-bold text-decoration-none">Creează un cont</a>
        </p>
    </form>
</div>

</body>
</html>
