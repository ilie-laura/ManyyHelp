<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editează Serviciu - Trustlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .edit-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; max-width: 600px; margin: 40px auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="edit-card p-4 p-md-5 shadow-sm">
        <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
            <h4 class="fw-bold text-dark mb-0"><i class="bi bi-pencil-square text-info me-2"></i>Editează Serviciul</h4>
            <a th:href="@{/users/{id}(id=${loggedUser.userid})}" class="btn btn-sm btn-light border rounded-pill">Anulează</a>
        </div>

        <form th:action="@{/services/edit/{id}(id=${service.serviceid})}" th:object="${service}" method="post">
            <input type="hidden" th:field="*{serviceid}"/>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Titlu Serviciu</label>
                <input type="text" th:field="*{numeServiciu}" class="form-control rounded-3 shadow-none" required>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Categorie</label>
                <select th:field="*{categorie}" class="form-select rounded-3 shadow-none" required>
                    <option value="instalatii">Instalații</option>
                    <option value="electricitate">Electricitate</option>
                    <option value="curatenie">Curățenie</option>
                    <option value="constructii">Construcții & Renovări</option>
                    <option value="auto">Auto & Tractări</option>
                    <option value="it">IT & Calculatoare</option>
                </select>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-dark">Tarif estimativ (RON)</label>
                    <input type="number" step="0.5" th:field="*{pret}" class="form-control rounded-3 shadow-none" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-dark">Oraș / Locație</label>
                    <input type="text" th:field="*{locatie}" class="form-control rounded-3 shadow-none" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">URL Imagine Reprezentativă</label>
                <input type="url" th:field="*{photourl}" class="form-control rounded-3 shadow-none" placeholder="https://...">
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-info text-white fw-bold rounded-pill px-4 flex-grow-1">
                    Salvează Modificările
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
