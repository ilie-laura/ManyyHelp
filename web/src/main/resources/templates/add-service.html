<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă Serviciu Nou - Trustlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/mainPage.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="pro-card p-4 bg-white shadow-sm rounded-4">
                <h3 class="fw-bold mb-4">Adaugă un serviciu nou</h3>

                <form th:action="@{/services/new}" th:object="${service}" method="post">

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Titlu / Nume Serviciu</label>
                        <input type="text" th:field="*{numeServiciu}" class="form-control" placeholder="ex: Reparații Centrale Termice" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Preț (RON)</label>
                            <input type="number" step="0.01" th:field="*{pret}" class="form-control" placeholder="150.00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Categorie</label>
                            <select th:field="*{categorie}" class="form-select" required>
                                <option value="">Alege o categorie...</option>
                                <option value="Instalații Sanitare">Instalații Sanitare</option>
                                <option value="Electrice">Electrice</option>
                                <option value="Curățenie">Curățenie</option>
                                <option value="Construcții">Construcții</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Oraș / Locație</label>
                        <input type="text" th:field="*{locatie}" class="form-control" placeholder="ex: București" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">URL Imagine Reprezentativă</label>
                        <input type="url" th:field="*{photourl}" class="form-control" placeholder="https://example.com/imagine.jpg">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-info text-white rounded-pill px-4">Publică Serviciul</button>
                        <a th:href="@{/browse-services}" class="btn btn-outline-secondary rounded-pill px-4">Anulează</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
